<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frames — Alan Cortes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
.filters{display:flex;gap:12px;flex-wrap:wrap;margin:32px 0}
.filters button{font:700 16px Archivo;background:var(--bg);border:var(--b);padding:10px 20px}
.filters button:hover{background:var(--grey)}
.filters button[aria-pressed=true]{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid figure{border:var(--b);overflow:hidden;aspect-ratio:3/4;position:relative;background:var(--grey)}
.grid figure.w{grid-column:span 2;aspect-ratio:auto}
.grid img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1);transition:filter .3s,transform .5s}
.grid figure:hover img{filter:none;transform:scale(1.06)}
.grid figcaption{position:absolute;left:0;bottom:0;background:#000;color:#fff;padding:6px 12px;font-size:14px;font-weight:700}
.grid [hidden]{display:none}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top"><a href="index.html">AC</a><nav><a href="route.html">Route</a><a href="play.html">Volleyball</a><a href="frames.html">Frames</a><a href="mailto:acortes2545@gmail.com">Email</a></nav></header>
<div class="pg">
  <h1>Frames.</h1>
  <div class="filters" role="group" aria-label="Filter photos"><button aria-pressed="true" data-f="all">All</button><button aria-pressed="false" data-f="travel">Travel</button><button aria-pressed="false" data-f="volleyball">Volleyball</button><button aria-pressed="false" data-f="everyday">Everyday</button></div>
  <div class="grid">
    <figure class="w" data-c="travel"><img loading="lazy" alt="Dusk over a landscape" src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1100&q=80"><figcaption>Somewhere new</figcaption></figure>
    <figure data-c="everyday"><img loading="lazy" alt="Sunlight over a field" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=80"><figcaption>Slow morning</figcaption></figure>
    <figure data-c="volleyball"><img loading="lazy" alt="Volleyball action" src="https://images.unsplash.com/photo-1592656094267-764a45160876?auto=format&fit=crop&w=800&q=80"><figcaption>Game point</figcaption></figure>
    <figure data-c="volleyball"><img loading="lazy" alt="Athletes on a court" src="https://images.unsplash.com/photo-1521412644187-c49fa049e84d?auto=format&fit=crop&w=800&q=80"><figcaption>Together</figcaption></figure>
    <figure class="w" data-c="everyday"><img loading="lazy" alt="Mountain lake" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1100&q=80"><figcaption>Outside the routine</figcaption></figure>
  </div>
  <p style="margin-top:24px"><small>Sample photos. Replace with Alan's own.</small></p>
</div>
<div class="foot"><span>Alan Cortes, Jersey City, NJ</span><span>© 2026</span></div>
<script src="site.js"></script>
<script>
$$(".filters button").forEach(b=>b.onclick=()=>{
  $$(".filters button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  $$(".grid figure").forEach(f=>f.hidden=b.dataset.f!=="all"&&f.dataset.c!==b.dataset.f);
});
</script>
</body>
</html>
